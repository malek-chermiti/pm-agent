name: CI Docker Build Check

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simuler l'absence du service Docker
        run: sudo systemctl stop docker

      - name: Tenter de fabriquer l'image Docker
        run: docker build -t pm-agent-image:latest .